<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Invoice Generator — freelancer-skills demo</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;max-width:820px;margin:24px auto;padding:0 16px;color:#111}
h1{font-size:24px} label{display:block;margin:10px 0 4px;font-weight:600}
input,select{width:100%;padding:8px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
table{width:100%;border-collapse:collapse;margin:12px 0} th,td{border-bottom:1px solid #ddd;padding:8px;text-align:left}
button{padding:10px 16px;border:0;border-radius:6px;background:#111;color:#fff;cursor:pointer;margin:6px 6px 0 0}
#invoice{border:1px solid #ddd;border-radius:8px;padding:20px;margin-top:20px}
.tot{text-align:right;font-weight:700;font-size:18px}
@media print{body>*:not(#invoice){display:none} #invoice{border:0}}
</style></head><body>
<h1>Invoice Generator</h1>
<p>Demo from <b>freelancer-skills</b> — same logic as the <code>invoice</code> skill. Nothing leaves your browser.</p>
<div class="row">
<div><label>Your name / business</label><input id="from" value="Nevo Studio"></div>
<div><label>Client</label><input id="client" value="Bright Studio"></div>
<div><label>Currency</label><select id="cur"><option>USD</option><option>EUR</option><option>GBP</option><option>BDT</option><option>INR</option></select></div>
<div><label>Tax / VAT %</label><input id="tax" type="number" value="0" min="0"></div>
<div><label>Invoice date</label><input id="date" type="date"></div>
<div><label>Due in (days)</label><input id="due" type="number" value="14" min="0"></div>
</div>
<label>Line items — one per line: description | qty | unit price</label>
<textarea id="items" rows="4" style="width:100%;padding:8px;box-sizing:border-box">Homepage redesign | 1 | 650
Logo tweaks | 2 | 75</textarea>
<button onclick="render()">Generate invoice</button>
<button onclick="window.print()">Print / Save as PDF</button>
<div id="invoice"></div>
<script>
document.getElementById('date').value=new Date().toISOString().slice(0,10);
function money(n,c){return new Intl.NumberFormat('en-US',{style:'currency',currency:c}).format(n)}
function render(){
 const cur=document.getElementById('cur').value, tax=+document.getElementById('tax').value||0;
 const d=new Date(document.getElementById('date').value||Date.now());
 const due=new Date(d); due.setDate(d.getDate()+(+document.getElementById('due').value||14));
 const num='INV-'+d.getFullYear()+'-'+String(Math.floor(1000+Math.random()*9000));
 let rows='', sub=0;
 document.getElementById('items').value.split('\n').forEach(l=>{const p=l.split('|'); if(p.length<3)return;
  const desc=p[0].trim(), q=+p[1]||0, u=+p[2]||0, t=q*u; sub+=t;
  rows+=`<tr><td>${desc}</td><td>${q}</td><td>${money(u,cur)}</td><td>${money(t,cur)}</td></tr>`;});
 const taxAmt=sub*tax/100, total=sub+taxAmt;
 document.getElementById('invoice').innerHTML=`<h2>INVOICE ${num}</h2>
 <p><b>From:</b> ${document.getElementById('from').value}<br><b>To:</b> ${document.getElementById('client').value}<br>
 <b>Date:</b> ${d.toISOString().slice(0,10)} &nbsp; <b>Due:</b> ${due.toISOString().slice(0,10)}</p>
 <table><tr><th>Description</th><th>Qty</th><th>Unit</th><th>Amount</th></tr>${rows}</table>
 <p>Subtotal: ${money(sub,cur)}<br>Tax (${tax}%): ${money(taxAmt,cur)}</p>
 <p class="tot">Total due: ${money(total,cur)}</p>
 <p>Payment due within ${document.getElementById('due').value} days. Thank you!</p>`;
 localStorage.setItem('freelancer-invoice', document.getElementById('invoice').innerHTML);
}
render();
</script></body></html>
